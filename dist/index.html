<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Conversor y analizador de audio en el navegador: detecta falsos lossless, mide loudness y convierte a FLAC, ALAC, AAC, MP3, Opus, WAV y AIFF con presets por dispositivo.">
<title>Lossless Buddy</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@500;600&family=Jersey+10&family=Special+Elite&family=Share+Tech+Mono&display=swap">
<style>
/* Design tokens: dark is the default skin, light applies via OS preference,
   [data-theme] (host) or [data-skin] (user toggle, persisted). */
:root{
  --desk-1:#272b32;--desk-2:#1b1e23;--plate-hi:#363c45;--plate:#2b3038;--plate-lo:#22262c;--plate-glint:rgba(255,255,255,.09);--plate-edge:rgba(0,0,0,.4);--drop:rgba(0,0,0,.55);
  --screw-hi:#8d949e;--screw-lo:#3b4048;--screw-slot:#22252a;--groove:#15171b;--groove-hi:rgba(255,255,255,.06);
  --silk:#c9d0da;--mute:#7f8894;--dim:#5d6571;--strong:#eef2f6;--warn-ink:#ffb340;--ring:#22262c;--ring-hi:rgba(255,255,255,.06);--led-ring:#191b1f;--ind-off:#3a3f47;
  --k-hi:#434951;--k-lo:#30353c;--k-on-hi:#2a2e34;--k-on-lo:#343940;--k-side:#24282d;--k-edge:#15171b;--k-glint:rgba(255,255,255,.12);--k-shadow:rgba(0,0,0,.55);--k-text:#d7dce3;
  --dish-1:#24282e;--dish-2:#3e444c;--dish-shadow:rgba(0,0,0,.55);--dish-rim:rgba(255,255,255,.08);--seam:#131518;
  --kwell:#15171a;--kwell-shadow:#000;--engr:#1c1f24;--recess:#1b1e23;--well-deep:#24282e;--hole:#0d0e10;color-scheme:dark;
  --red:#ff3b30; --red-glow:rgba(255,59,48,.55); --green:#36e07a; --green-glow:rgba(54,224,122,.5); --amber:#ffb340; --amber-glow:rgba(255,179,64,.5);
  --accent:#ff6a1a; --accent-glow:rgba(255,106,26,.55);
  --win:#0d0e10;
  --lcd-1:#b4c2a0; --lcd-2:#98a886; --lcd-ink:#18210f; --lcd-ghost:rgba(24,33,15,.16);
  --f-ui:"Barlow", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-silk:"Barlow Condensed", "Arial Narrow", sans-serif;
  --f-lcd:"Jersey 10", "Share Tech Mono", ui-monospace, monospace;
  --f-mono:"Share Tech Mono", ui-monospace, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]):not([data-skin]){--desk-1:#f1f2f4;--desk-2:#cfd3d8;--plate-hi:#fafafb;--plate:#e9eaec;--plate-lo:#d9dbde;--plate-glint:#fff;--plate-edge:rgba(0,0,0,.12);--drop:rgba(40,45,55,.25);
  --screw-hi:#ffffff;--screw-lo:#a9aeb5;--screw-slot:#8c9198;--groove:#c4c7cc;--groove-hi:rgba(255,255,255,.9);
  --silk:#33373d;--mute:#737981;--dim:#959ba3;--strong:#17191c;--warn-ink:#b0560c;--ring:#c7cacf;--ring-hi:rgba(255,255,255,.9);--led-ring:#b8bcc2;--ind-off:#c3c7cc;
  --k-hi:#fbfbfc;--k-lo:#e3e5e8;--k-on-hi:#d9dce0;--k-on-lo:#e5e7ea;--k-side:#c9ccd1;--k-edge:#bcc0c6;--k-glint:#ffffff;--k-shadow:rgba(40,45,55,.25);--k-text:#3b3f46;
  --dish-1:#d0d3d8;--dish-2:#f6f7f8;--dish-shadow:rgba(40,45,55,.22);--dish-rim:rgba(255,255,255,.95);--seam:#aeb2b8;
  --kwell:#cdd0d4;--kwell-shadow:rgba(40,45,55,.45);--engr:#b9bdc3;--recess:#d6d9dc;--well-deep:#dcdee2;--hole:#8f949b;color-scheme:light;}}
:root[data-theme="light"]:not([data-skin]){--desk-1:#f1f2f4;--desk-2:#cfd3d8;--plate-hi:#fafafb;--plate:#e9eaec;--plate-lo:#d9dbde;--plate-glint:#fff;--plate-edge:rgba(0,0,0,.12);--drop:rgba(40,45,55,.25);
  --screw-hi:#ffffff;--screw-lo:#a9aeb5;--screw-slot:#8c9198;--groove:#c4c7cc;--groove-hi:rgba(255,255,255,.9);
  --silk:#33373d;--mute:#737981;--dim:#959ba3;--strong:#17191c;--warn-ink:#b0560c;--ring:#c7cacf;--ring-hi:rgba(255,255,255,.9);--led-ring:#b8bcc2;--ind-off:#c3c7cc;
  --k-hi:#fbfbfc;--k-lo:#e3e5e8;--k-on-hi:#d9dce0;--k-on-lo:#e5e7ea;--k-side:#c9ccd1;--k-edge:#bcc0c6;--k-glint:#ffffff;--k-shadow:rgba(40,45,55,.25);--k-text:#3b3f46;
  --dish-1:#d0d3d8;--dish-2:#f6f7f8;--dish-shadow:rgba(40,45,55,.22);--dish-rim:rgba(255,255,255,.95);--seam:#aeb2b8;
  --kwell:#cdd0d4;--kwell-shadow:rgba(40,45,55,.45);--engr:#b9bdc3;--recess:#d6d9dc;--well-deep:#dcdee2;--hole:#8f949b;color-scheme:light;}
:root[data-skin="light"]{--desk-1:#f1f2f4;--desk-2:#cfd3d8;--plate-hi:#fafafb;--plate:#e9eaec;--plate-lo:#d9dbde;--plate-glint:#fff;--plate-edge:rgba(0,0,0,.12);--drop:rgba(40,45,55,.25);
  --screw-hi:#ffffff;--screw-lo:#a9aeb5;--screw-slot:#8c9198;--groove:#c4c7cc;--groove-hi:rgba(255,255,255,.9);
  --silk:#33373d;--mute:#737981;--dim:#959ba3;--strong:#17191c;--warn-ink:#b0560c;--ring:#c7cacf;--ring-hi:rgba(255,255,255,.9);--led-ring:#b8bcc2;--ind-off:#c3c7cc;
  --k-hi:#fbfbfc;--k-lo:#e3e5e8;--k-on-hi:#d9dce0;--k-on-lo:#e5e7ea;--k-side:#c9ccd1;--k-edge:#bcc0c6;--k-glint:#ffffff;--k-shadow:rgba(40,45,55,.25);--k-text:#3b3f46;
  --dish-1:#d0d3d8;--dish-2:#f6f7f8;--dish-shadow:rgba(40,45,55,.22);--dish-rim:rgba(255,255,255,.95);--seam:#aeb2b8;
  --kwell:#cdd0d4;--kwell-shadow:rgba(40,45,55,.45);--engr:#b9bdc3;--recess:#d6d9dc;--well-deep:#dcdee2;--hole:#8f949b;color-scheme:light;}
</style>
<style>
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:radial-gradient(1200px 700px at 50% -10%,var(--desk-1),var(--desk-2));color:var(--silk);font-family:var(--f-ui);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased;min-height:100%;transition:background .3s}
.wrap{max-width:1000px;margin:0 auto;padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));padding-block:30px 64px;display:flex;flex-direction:column;gap:26px}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.silk{font-family:var(--f-silk);font-weight:600;font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--mute)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* header */
header{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;padding-inline:4px}
.brand{display:flex;align-items:baseline;gap:10px}
.brand b{font-family:var(--f-silk);font-size:22px;letter-spacing:.06em;text-transform:uppercase;color:var(--strong);font-weight:600}
.brand span{font-family:var(--f-mono);font-size:13px;color:var(--mute)}
.hright{display:flex;align-items:center;gap:22px;flex-wrap:wrap}
.engines{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.eng{display:flex;align-items:center;gap:7px;font-family:var(--f-silk);font-size:12px;letter-spacing:.14em;color:var(--mute)}
.theme{display:flex;align-items:center;gap:8px;background:none;border:0;padding:0;cursor:pointer;font-family:var(--f-silk);font-weight:600;font-size:11px;letter-spacing:.16em;color:var(--mute)}
.theme .sw{width:52px;height:26px}
.theme .sw i{width:28px;height:20px;top:3px;left:3px}
.theme .sw i::after{width:14px;height:14px;top:3px;right:3px}
.theme[aria-checked="true"] .sw i{transform:translateX(18px)}

/* LEDs */
.led{width:11px;height:11px;border-radius:50%;flex:none;background:radial-gradient(circle at 40% 35%,#4a4f57,#24272c);box-shadow:inset 0 1px 2px #000,0 0 0 2px var(--led-ring)}
.led.sm{width:8px;height:8px}
.led.red{background:radial-gradient(circle at 40% 35%,#5c2622,#2a1513)}
.led.green{background:radial-gradient(circle at 40% 35%,#1f4a30,#11251a)}
.led.amber{background:radial-gradient(circle at 40% 35%,#5a4220,#2a1f10)}
.led.yellow{background:radial-gradient(circle at 40% 35%,#55501c,#29270e)}
.led.red.on{background:radial-gradient(circle at 40% 35%,#ffd0ca 0 12%,var(--red) 48%,#a3170f);box-shadow:0 0 12px 2px var(--red-glow),0 0 0 2px var(--led-ring)}
.led.green.on{background:radial-gradient(circle at 40% 35%,#d5ffe5 0 12%,var(--green) 48%,#0f8a42);box-shadow:0 0 12px 2px var(--green-glow),0 0 0 2px var(--led-ring)}
.led.amber.on{background:radial-gradient(circle at 40% 35%,#fff0d0 0 12%,var(--amber) 48%,#a3650c);box-shadow:0 0 12px 2px var(--amber-glow),0 0 0 2px var(--led-ring)}
.led.yellow.on{background:radial-gradient(circle at 40% 35%,#fffbd0 0 12%,#f2dc3c 48%,#9a8a10);box-shadow:0 0 12px 2px rgba(242,220,60,.5),0 0 0 2px var(--led-ring)}

/* faceplate */
.plate{-webkit-user-select:none;user-select:none;position:relative;border-radius:26px;background:linear-gradient(180deg,var(--plate-hi),var(--plate) 16%,var(--plate-lo));
  box-shadow:inset 0 1px 0 var(--plate-glint),inset 0 -1px 0 var(--plate-edge),0 30px 60px -22px var(--drop),0 2px 4px var(--drop);padding:34px 38px 28px;transition:background .3s}
.screw{position:absolute;width:12px;height:12px;border-radius:50%;background:radial-gradient(circle at 35% 30%,var(--screw-hi),var(--screw-lo) 70%);box-shadow:inset 0 -1px 1px rgba(0,0,0,.35),0 1px 0 var(--plate-glint)}
.screw::after{content:"";position:absolute;left:2px;right:2px;top:5px;height:2px;background:var(--screw-slot);border-radius:1px;transform:rotate(var(--r,35deg))}
.screw.tl{top:12px;left:12px}.screw.tr{top:12px;right:12px;--r:-20deg}.screw.bl{bottom:12px;left:12px;--r:70deg}.screw.br{bottom:12px;right:12px;--r:10deg}
.groove{height:2px;background:var(--groove);box-shadow:0 1px 0 var(--groove-hi);border-radius:1px}
.phead{display:flex;align-items:center;gap:8px}
.cap{display:flex;align-items:center;gap:8px;justify-content:center;min-height:30px}
.hint{font-size:12.5px;color:var(--dim);text-align:center}

/* black instrument windows: all the same height */
.top{display:grid;grid-template-columns:270px minmax(0,1fr) 200px;gap:20px;align-items:start}
.cell{display:flex;flex-direction:column;gap:10px;min-width:0}
.win{height:176px;background:var(--win);border-radius:12px;box-shadow:inset 0 2px 8px #000,0 0 0 3px var(--ring),0 1px 0 3.5px var(--ring-hi);position:relative}
.meter{padding:10px}
.meter svg{display:block;width:100%;height:100%;border-radius:6px}
.lamps{display:flex;justify-content:center;align-items:center;gap:11px;flex-wrap:wrap;min-height:30px}
.lamp{display:flex;align-items:center;gap:6px;font-family:var(--f-silk);font-size:11.5px;letter-spacing:.14em;color:var(--mute)}
.lamp.lit{color:var(--strong)}
.screen{cursor:crosshair;touch-action:none}
.screen canvas{position:absolute;left:10px;top:10px;width:calc(100% - 56px);height:calc(100% - 20px);border-radius:4px}
.axis{position:absolute;right:0;top:10px;bottom:10px;width:46px;font-family:var(--f-mono);font-size:10.5px;color:#7d7b78}
.axis span{position:absolute;left:6px;transform:translateY(50%)}
.cutline{position:absolute;left:10px;right:46px;border-top:1px dashed #e8e6e1;opacity:.8;pointer-events:none}
.cutline span{position:absolute;right:6px;top:-21px;font-family:var(--f-lcd);font-size:16px;letter-spacing:.04em;color:var(--lcd-ink);background:var(--lcd-1);padding:0 6px;border-radius:3px}
.playhead{position:absolute;top:6px;bottom:6px;width:2px;margin-left:-1px;background:#e3261b;box-shadow:0 0 6px rgba(227,38,27,.75);pointer-events:none}
.scopebar{display:flex;align-items:center;gap:10px;justify-content:center;flex-wrap:wrap;min-height:30px}
.ladder{padding:10px 8px 8px 12px;display:flex;gap:5px;justify-content:space-between}
.lcol{display:flex;flex-direction:column-reverse;gap:3px;flex:none;width:15px}
.seg{flex:1;min-height:5px;border-radius:2px;background:#1d2a21}
.seg.a{background:#2f2817}.seg.r{background:#2f1a18}
.seg.on{background:var(--green);box-shadow:0 0 6px var(--green-glow)}
.seg.a.on{background:var(--amber);box-shadow:0 0 6px var(--amber-glow)}
.seg.r.on{background:var(--red);box-shadow:0 0 6px var(--red-glow)}
.lscale{font-family:var(--f-mono);font-size:10px;color:#6b7078;flex:none}
.lread{flex:1;min-width:0;display:grid;grid-template-columns:max-content minmax(0,1fr);align-content:center;gap:6px 8px;padding-left:12px;margin-left:4px;border-left:1px solid #23272d;font-family:var(--f-lcd);color:#ff8a3d;text-shadow:0 0 8px rgba(255,120,40,.35)}
.lread span{font-size:14px;letter-spacing:.08em;opacity:.55;align-self:center}
.lread b{font-weight:400;font-size:22px;line-height:1;text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
.ladder[data-order="txt"] .lread{order:-1;padding-left:0;margin-left:0;border-left:0;padding-right:12px;margin-right:4px;border-right:1px solid #23272d}
.ladder[data-al="t"] .lread{align-content:start;padding-top:2px}
.ladder[data-al="s"] .lread{align-content:space-between;padding-block:2px}
.lread b.big{font-size:32px}

/* green reflective LCD */
.disp-row{display:flex;gap:14px;align-items:stretch;min-width:0}
.display{position:relative;flex:1;min-width:0;border-radius:10px;padding:10px 18px;cursor:pointer;color:var(--lcd-ink);font-family:var(--f-lcd);
  background:radial-gradient(140% 120% at 30% 0%,var(--lcd-1),var(--lcd-2));
  box-shadow:inset 0 3px 8px rgba(0,0,0,.35),inset 0 0 0 1px rgba(0,0,0,.25),0 0 0 4px var(--win),0 0 0 7px var(--ring),0 1px 0 7.5px var(--ring-hi);
  display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 24px;align-items:center}
.display::before{content:"";position:absolute;inset:0;border-radius:10px;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(0,0,0,.035) 0 1px,transparent 1px 3px),repeating-linear-gradient(90deg,rgba(0,0,0,.03) 0 1px,transparent 1px 3px)}
.display::after{content:"";position:absolute;inset:0;border-radius:10px;pointer-events:none;background:linear-gradient(165deg,rgba(255,255,255,.22),transparent 40%)}
.dcol{min-width:0;display:flex;flex-direction:column;gap:2px}
.dl{font-size:19px;line-height:1.08;letter-spacing:.05em;text-transform:uppercase;text-shadow:2px 2px 0 var(--lcd-ghost);overflow-wrap:anywhere}
.dl.big{font-size:30px;line-height:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dl.dim{opacity:.72}
.dl.st.bad{animation:blink 1.6s steps(2,start) 3}
@keyframes blink{50%{opacity:.25}}
.dnum{display:grid;grid-template-columns:auto auto;gap:0 10px;align-items:baseline;padding-left:18px;border-left:2px solid var(--lcd-ghost)}
.dnum span{font-size:16px;letter-spacing:.08em;opacity:.7}
.dnum b{font-weight:400;font-size:24px;line-height:1.05;text-align:right;text-shadow:2px 2px 0 var(--lcd-ghost)}
.dnum b.big{font-size:38px}
.display.out{cursor:default;height:66px;overflow:hidden;grid-template-columns:auto minmax(0,1fr);gap:4px 16px;margin:0 7px 26px}
.display.out .dl{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-height:1.08em}
.olbl{justify-self:start;font-family:var(--f-lcd);font-size:17px;letter-spacing:.12em;padding:1px 8px 0;background:var(--lcd-ink);color:var(--lcd-1);border-radius:3px;align-self:center}
.dopen{appearance:none;border:0;background:none;color:var(--lcd-ink);cursor:pointer;align-self:stretch;display:flex;flex-direction:row;align-items:center;justify-content:center;gap:10px;
  padding:4px 4px 4px 22px;margin:-4px 0;border-left:2px solid var(--lcd-ghost);font-family:var(--f-lcd);font-size:20px;letter-spacing:.08em}
.dopen .px{width:30px;height:30px;fill:currentColor;shape-rendering:crispEdges;filter:drop-shadow(2px 2px 0 var(--lcd-ghost))}
.dopen span{text-shadow:2px 2px 0 var(--lcd-ghost)}
.dopen:hover .px,.dopen:focus-visible .px{animation:bob .8s steps(2,end) infinite}
@keyframes bob{50%{transform:translateY(-3px)}}
body.dragging .display{box-shadow:inset 0 3px 8px rgba(0,0,0,.35),0 0 0 4px var(--accent)}

/* keys: aluminium keypad, square keys with a dished centre */
.pad{display:flex;gap:2px;padding:2px;background:var(--seam);border-radius:11px;box-shadow:0 1px 0 var(--ring-hi),inset 0 1px 2px rgba(0,0,0,.35);flex:none}
.tk{appearance:none;border:0;position:relative;width:76px;height:76px;border-radius:4px;cursor:pointer;color:var(--k-text);
  background:linear-gradient(180deg,var(--k-hi),var(--k-lo));box-shadow:inset 0 1px 0 var(--k-glint),inset 0 -2px 0 var(--k-side),0 1px 2px var(--k-shadow);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-family:var(--f-silk);font-weight:600;letter-spacing:.1em;font-size:13px;transition:transform .08s,background .15s,box-shadow .08s}
.pad .tk:first-child{border-radius:9px 4px 4px 9px}.pad .tk:last-child{border-radius:4px 9px 9px 4px}.pad .tk:only-child{border-radius:9px}
.tk::before{content:"";position:absolute;left:50%;top:50%;height:60%;width:auto;aspect-ratio:1;transform:translate(-50%,-50%);border-radius:50%;
  background:radial-gradient(circle at 50% 30%,var(--dish-1),var(--dish-2) 75%);box-shadow:inset 0 3px 6px var(--dish-shadow),inset 0 -1px 0 var(--dish-rim),0 1px 0 var(--dish-rim)}
.tk > *{position:relative}
.tk svg{width:16px;height:16px}
.tk small{font-size:9.5px;letter-spacing:.1em;color:var(--mute);font-weight:500;position:absolute;bottom:5px;left:0;right:0;text-align:center}
.tk::after{content:"";position:absolute;left:8px;top:8px;width:5px;height:5px;border-radius:50%;background:var(--ind-off)}
.tk:active,.tk.down,.tk[aria-checked="true"]{background:linear-gradient(180deg,var(--k-on-hi),var(--k-on-lo));box-shadow:inset 0 2px 4px var(--k-shadow),inset 0 -1px 0 var(--k-glint);transform:translateY(1px)}
.tk[aria-checked="true"]{color:var(--strong)}
.tk[aria-checked="true"]::after{background:var(--accent);box-shadow:0 0 6px 1px var(--accent-glow)}
.tk:disabled{cursor:not-allowed;color:var(--dim)}
.tk.off small{text-decoration:line-through}
#deck .tk,#segCh .tk{width:88px;height:88px;font-size:13px;letter-spacing:.08em}
#deck .tk::before,#segCh .tk::before{height:64%}
.tk.play::after,.tk.rec::after{display:none}
.tk.rec{width:156px}
.tk.rec::before{left:38px}
.tk.rec .dot{position:absolute;left:30px;top:50%;margin-top:-8px}
.tk.rec .ring{left:38px;width:54px}
.tk.rec .lbl{position:absolute;left:68px;right:8px;top:0;bottom:0;display:grid;place-items:center;font-size:13px;letter-spacing:.16em;color:var(--k-text)}
.tk.rec:disabled .lbl{color:var(--dim)}
.tk.rec .dot{width:16px;height:16px;border-radius:50%;background:radial-gradient(circle at 40% 35%,#ffb08a,var(--accent) 55%,#c2440c);box-shadow:0 1px 2px rgba(0,0,0,.3)}
.tk.rec.busy .dot{animation:blink 1s steps(2,start) infinite;box-shadow:0 0 10px 2px var(--accent-glow)}
.tk.rec:disabled .dot{background:radial-gradient(circle at 40% 35%,#b9a79e,#8e7a70);box-shadow:none}
.tk .ring{position:absolute;left:50%;top:50%;width:70%;aspect-ratio:1;transform:translate(-50%,-50%);border-radius:50%;pointer-events:none;
  background:conic-gradient(var(--accent) calc(var(--p,0)*1turn),transparent 0);-webkit-mask:radial-gradient(circle,transparent 62%,#000 64%);mask:radial-gradient(circle,transparent 62%,#000 64%);opacity:0;transition:opacity .2s}
.tk.rec.busy .ring{opacity:1}
.tk.mini{width:auto;min-width:56px;height:36px;padding:0 12px;font-size:11.5px}
.tk.mini::before{display:none}
.tk.mini::after{left:50%;top:5px;width:12px;height:2px;margin-left:-6px;border-radius:1px}
.pad.mini{border-radius:9px}
.pad.mini .tk:first-child{border-radius:7px 3px 3px 7px}.pad.mini .tk:last-child{border-radius:3px 7px 7px 3px}
/* generic rectangular keys */
.key{appearance:none;border:1px solid var(--k-edge);border-radius:8px;background:linear-gradient(180deg,var(--k-hi),var(--k-lo));color:var(--k-text);cursor:pointer;
  box-shadow:inset 0 1px 0 var(--k-glint),inset 0 -2px 0 var(--k-side),0 2px 4px var(--k-shadow);transition:transform .07s,box-shadow .07s;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;font-family:var(--f-silk);font-weight:600;letter-spacing:.14em;text-transform:uppercase;font-size:12px}
.key:active,.key.on{background:linear-gradient(180deg,var(--k-on-hi),var(--k-on-lo));box-shadow:inset 0 2px 4px var(--k-shadow);transform:translateY(1px)}
.key:disabled{cursor:not-allowed;opacity:.55}
.bar{width:26px;height:3px;border-radius:2px;background:var(--ind-off)}
.key.on .bar{background:var(--accent);box-shadow:0 0 8px 1px var(--accent-glow)}
.sq{width:56px;height:56px}
.sq svg{width:16px;height:16px}
.load{width:76px;height:auto}

/* tuner */
.tuner{display:flex;align-items:center;gap:16px;margin-top:22px}
.dialbox{flex:1;min-width:0;display:flex;align-items:center;gap:12px;height:80px;padding:7px 10px 7px 7px;background:var(--win);border-radius:12px;box-shadow:inset 0 2px 6px #000,0 0 0 3px var(--ring),0 1px 0 3.5px var(--ring-hi)}
.dialbox{display:grid;grid-template-columns:minmax(0,1fr) auto auto;grid-template-rows:auto 64px;gap:12px 14px;height:auto;padding:10px 14px 10px 10px}
.dialbox .display{grid-column:1 / -1;box-shadow:inset 0 3px 8px rgba(0,0,0,.35),inset 0 0 0 1px rgba(0,0,0,.25);border-radius:6px}
.dialbox .display::before,.dialbox .display::after{border-radius:6px}
/* track display: orange on black */
#display[data-v]{--lcd-1:#120a05;--lcd-2:#070403;--lcd-ink:#ff7a2a;--lcd-ghost:rgba(255,122,42,.13);--glow:rgba(255,110,30,.55)}
#display[data-v] .dl,#display[data-v] .dopen span{text-shadow:0 0 6px var(--glow),0 0 1px var(--lcd-ink)}
#display[data-v] .dopen .px{filter:drop-shadow(0 0 5px var(--glow))}
#display[data-v]::after{background:linear-gradient(165deg,rgba(255,255,255,.07),transparent 40%)}
#display[data-v="e"]{--lcd-ink:#ff8a3d}
#display[data-v="e"] .dl,#display[data-v="e"] .dopen span{text-shadow:2px 2px 0 rgba(255,138,61,.16),0 0 8px rgba(255,120,40,.35)}
#display[data-v="e"]::before{background:linear-gradient(90deg,rgba(255,138,61,.05) 1px,transparent 1px) 0 0/4px 4px,linear-gradient(0deg,rgba(255,138,61,.05) 1px,transparent 1px) 0 0/4px 4px}
.dopen.call .px{animation:blink 1.6s steps(2,start) infinite}
.dialbox .tk.play{width:60px;height:60px}
.strip{justify-content:flex-start;flex-wrap:nowrap;gap:10px;height:42px;min-height:0;padding:0 7px 0 14px;background:var(--win);border-radius:10px;
  box-shadow:inset 0 2px 6px #000,0 0 0 3px var(--ring),0 1px 0 3.5px var(--ring-hi);margin:4px 3px 0}
.top .cell{background:var(--win);border-radius:14px;padding:8px 8px 0;gap:6px;box-shadow:inset 0 2px 6px #000,0 0 0 3px var(--ring),0 1px 0 3.5px var(--ring-hi)}
.top .cell .win{box-shadow:inset 0 2px 8px #000,inset 0 0 0 1px rgba(255,255,255,.05)}
.top .cell .strip{background:none;box-shadow:none;margin:0;height:40px;padding:0 4px 0 8px;border-top:1px solid rgba(255,255,255,.06);border-radius:0}
.strip .silk,.strip .lamp{color:#7d8792}
.strip .lamp.lit{color:#eef2f6}
.strip .sctl{margin-left:auto;display:flex;align-items:center;gap:8px;flex:none}
.strip{min-width:0}.strip .silk{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.strip .info{border-color:#15171b;background:linear-gradient(180deg,#434951,#30353c);box-shadow:0 1px 2px rgba(0,0,0,.55);color:#7f8894}
@media (max-width:380px){.lamps.strip{gap:6px}.strip .lamp{letter-spacing:.05em;gap:4px}}
.strip .txsw{height:28px;background:#1c1f24;box-shadow:inset 0 2px 4px #000}
.strip .txsw i{top:2px;height:24px}
.tk.play{color:#fff;background:linear-gradient(180deg,#ff8a4a,var(--accent) 55%,#d9500e);box-shadow:inset 0 1px 0 rgba(255,255,255,.35),inset 0 -2px 0 #a8400a,0 2px 3px var(--k-shadow)}
.tk.play::before{background:radial-gradient(circle at 50% 30%,#d9500e,#ff7a33 75%);box-shadow:inset 0 3px 6px rgba(120,35,0,.55),inset 0 -1px 0 rgba(255,200,160,.5),0 1px 0 rgba(255,200,160,.5)}
.tk.play:active,.tk.play.down,.tk.play.on{background:linear-gradient(180deg,#e0621f,#f0722d);box-shadow:inset 0 2px 4px rgba(90,25,0,.6)}
.dial{position:relative;flex:1;min-width:0;height:100%;cursor:ew-resize;touch-action:none}
.dial canvas{position:absolute;inset:0;width:100%;height:100%;border-radius:6px}
.dial .glass{position:absolute;inset:0;border-radius:6px;background:linear-gradient(180deg,rgba(255,255,255,.35),rgba(255,255,255,0) 45%,rgba(0,0,0,.08));box-shadow:inset 0 0 0 1px rgba(0,0,0,.3),inset 0 3px 6px rgba(0,0,0,.25);pointer-events:none}
.dial .red{position:absolute;top:-2px;bottom:-2px;width:2px;margin-left:-1px;background:#e3261b;box-shadow:0 0 6px rgba(227,38,27,.75);pointer-events:none;border-radius:1px}
.tunewell{position:relative;width:60px;height:60px;border-radius:50%;background:#16181b;box-shadow:inset 0 3px 8px #000,0 1px 0 rgba(255,255,255,.07);display:grid;place-items:center;flex:none}
.tunewell::before{content:"";position:absolute;top:-6px;left:50%;width:2px;height:4px;margin-left:-1px;background:var(--accent);box-shadow:0 0 6px var(--accent-glow);border-radius:1px}
.tune{position:relative;width:50px;height:50px;border-radius:50%;cursor:grab;touch-action:none;box-shadow:0 9px 14px rgba(0,0,0,.65),0 2px 3px rgba(0,0,0,.6)}
.tune:active{cursor:grabbing}
.tune-ring{position:absolute;inset:0;border-radius:50%;background:repeating-conic-gradient(#cfd4da 0 2.5deg,#59606a 2.5deg 5deg)}
.tune-shade{position:absolute;inset:0;border-radius:50%;background:linear-gradient(160deg,rgba(255,255,255,.35),rgba(255,255,255,0) 40%,rgba(0,0,0,.55));box-shadow:inset 0 0 0 1px rgba(0,0,0,.5)}
.tune-cap{position:absolute;inset:4px;border-radius:50%;
  background:radial-gradient(circle,rgba(255,255,255,.25) 0 2%,transparent 3%),repeating-radial-gradient(circle,rgba(255,255,255,.05) 0 1px,rgba(0,0,0,.035) 1px 2px),
    conic-gradient(from 25deg,#eef0f3,#8b9098 12%,#f6f7f9 25%,#7f858d 38%,#e7e9ec 50%,#868b93 62%,#f3f4f6 75%,#878c94 88%,#eef0f3);
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.45),0 0 0 1px rgba(0,0,0,.45)}
.tune-rot{position:absolute;inset:4px;border-radius:50%}
.dimple{position:absolute;left:50%;top:4px;width:12px;height:12px;margin-left:-6px;border-radius:50%;
  background:radial-gradient(circle at 50% 70%,rgba(255,255,255,.55),rgba(0,0,0,.18) 55%,rgba(0,0,0,.38));box-shadow:inset 0 2px 3px rgba(0,0,0,.5),0 1px 0 rgba(255,255,255,.6)}

/* knobs */
.deckrow{display:flex;flex-direction:column;gap:22px}
.padrow{display:flex;gap:18px;flex-wrap:wrap;align-items:flex-end}
.padcol{display:flex;flex-direction:column;align-items:flex-start;gap:10px;min-width:0}

.deckgrp{display:flex;flex-direction:column;gap:10px}
.jrow{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.ctl{display:flex;flex-direction:column;align-items:center;gap:2px}
.kwrap{--s:76px;--m:34px;position:relative;width:calc(var(--s) + var(--m)*2);height:calc(var(--s) + var(--m)*2);touch-action:none}
.kwell{position:absolute;inset:calc(var(--m) - 6px);border-radius:50%;background:var(--kwell);box-shadow:inset 0 3px 8px var(--kwell-shadow),0 1px 0 var(--ring-hi)}
.kn{position:absolute;inset:var(--m);border-radius:50%;cursor:grab;
  background:radial-gradient(circle,rgba(255,255,255,.25) 0 2%,transparent 3%),repeating-radial-gradient(circle,rgba(255,255,255,.05) 0 1px,rgba(0,0,0,.035) 1px 2px),
    conic-gradient(from 25deg,#eef0f3,#8b9098 12%,#f6f7f9 25%,#7f858d 38%,#e7e9ec 50%,#868b93 62%,#f3f4f6 75%,#878c94 88%,#eef0f3);
  box-shadow:0 10px 18px var(--drop),0 3px 4px var(--drop),inset 0 0 0 1px rgba(255,255,255,.4),inset 0 0 0 5px rgba(0,0,0,.12),inset 0 0 0 6px rgba(255,255,255,.25)}
.kn:active{cursor:grabbing}
.kn .rot{position:absolute;inset:0;transition:transform .22s cubic-bezier(.3,1.5,.5,1)}
.kn .ptr{position:absolute;left:50%;top:8%;width:4px;height:24%;transform:translateX(-50%);background:#1c1e22;border-radius:2px;box-shadow:0 1px 0 rgba(255,255,255,.5)}
.kopt{position:absolute;transform:translate(-50%,-50%);background:none;border:0;padding:3px 4px;cursor:pointer;font-family:var(--f-silk);font-weight:600;font-size:12px;letter-spacing:.08em;color:var(--dim);white-space:nowrap;line-height:1}
.kopt:hover{color:var(--silk)}
.kopt[aria-current="true"]{color:var(--strong)}
.kdot{position:absolute;width:5px;height:5px;border-radius:50%;background:var(--ind-off);transform:translate(-50%,-50%);pointer-events:none}
.kdot.on{background:var(--accent);box-shadow:0 0 8px 2px var(--accent-glow)}
.ktitle{display:flex;align-items:center;gap:6px;margin-top:-6px}

/* info + popover */
.info{appearance:none;width:18px;height:18px;border-radius:50%;border:1px solid var(--k-edge);background:linear-gradient(180deg,var(--k-hi),var(--k-lo));color:var(--mute);font-family:Georgia,serif;font-style:italic;font-size:11px;line-height:1;display:inline-grid;place-items:center;cursor:pointer;padding:0;flex:none;box-shadow:0 1px 2px var(--k-shadow)}
.info:hover,.info[aria-expanded="true"]{color:var(--strong);border-color:var(--accent)}
.pop{position:fixed;z-index:30;max-width:min(300px,calc(100vw - 32px));background:#121417;border:1px solid #3a4049;border-radius:10px;padding:12px 14px;font-size:13.5px;line-height:1.5;color:#dfe5ec;box-shadow:0 14px 30px rgba(0,0,0,.45)}
.pop b{display:block;font-family:var(--f-silk);letter-spacing:.12em;text-transform:uppercase;font-size:12px;color:var(--accent);margin-bottom:4px}
.pop p{margin:0}
.pop p + p{margin-top:6px;color:#aab3be}

/* slide switch (theme) */
.sw{display:inline-block;border-radius:99px;background:var(--win);position:relative;box-shadow:inset 0 2px 5px #000,0 0 0 2px var(--ring),0 1px 0 2.5px var(--ring-hi)}
.sw i{position:absolute;border-radius:99px;background:linear-gradient(180deg,var(--k-hi),var(--k-lo));box-shadow:inset 0 1px 0 var(--k-glint),0 2px 4px rgba(0,0,0,.6);transition:transform .2s cubic-bezier(.3,1.3,.5,1)}
.sw i::after{content:"";position:absolute;border-radius:50%;background:radial-gradient(circle at 50% 30%,var(--dish-1),var(--dish-2));box-shadow:inset 0 1px 2px var(--dish-shadow)}

/* label: cover + tags */
.jcard{margin-top:24px;display:grid;grid-template-columns:auto minmax(0,1fr);gap:22px;align-items:start}
.cov{width:112px;height:112px;border-radius:10px;background:var(--win);position:relative;overflow:hidden;cursor:pointer;display:grid;place-items:center;text-align:center;color:#7d838c;font-family:var(--f-silk);font-size:11px;letter-spacing:.14em;padding:0;border:0;
  box-shadow:inset 0 2px 8px #000,0 0 0 3px var(--ring),0 1px 0 3.5px var(--ring-hi)}
.cov img{position:absolute;inset:6px;width:calc(100% - 12px);height:calc(100% - 12px);object-fit:cover;border-radius:4px}
.cov .x{position:absolute;inset:6px;border-radius:4px;background:rgba(10,10,12,.72);display:grid;place-items:center;color:#f2dcd6;font-weight:600}
.cov::after{content:"CAMBIAR";position:absolute;inset:6px;border-radius:4px;display:grid;place-items:center;background:rgba(0,0,0,.6);color:#fff;opacity:0;transition:opacity .15s;font-family:var(--f-silk);font-weight:600;letter-spacing:.16em;font-size:11px}
.cov:hover::after{opacity:1}
body.dragging .cov{box-shadow:inset 0 2px 8px #000,0 0 0 3px var(--accent)}
.jmain{min-width:0;display:flex;flex-direction:column;gap:12px}
.jhead{display:flex;align-items:center;gap:10px;min-width:0}
.jtitle{font-family:var(--f-silk);font-weight:600;font-size:19px;letter-spacing:.04em;color:var(--strong);flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.jkey{height:32px;padding:0 12px;flex-direction:row;font-size:11px;flex:none}
.jnote{font-size:13px;color:var(--mute);line-height:1.4}
.jnote.warn{color:var(--warn-ink)}
.tagform{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px 14px;padding-top:4px}
.tagform label{display:flex;flex-direction:column;gap:5px;font-family:var(--f-silk);font-weight:600;font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--mute);min-width:0}
.tagform input{font-family:var(--f-lcd);font-size:20px;letter-spacing:.04em;color:var(--lcd-ink);background:linear-gradient(180deg,var(--lcd-2),var(--lcd-1));border:0;border-radius:5px;padding:3px 10px;outline:none;-webkit-user-select:text;user-select:text;min-width:0;width:100%;
  box-shadow:inset 0 2px 4px rgba(0,0,0,.35),0 0 0 3px var(--win),0 0 0 5px var(--ring)}
.tagform input:focus{box-shadow:inset 0 2px 4px rgba(0,0,0,.35),0 0 0 3px var(--win),0 0 0 5px var(--accent)}
.tagform .wide{grid-column:span 2}
/* text switch (LIN/LOG) */
.txsw{position:relative;width:88px;height:30px;border-radius:99px;border:0;padding:0;cursor:pointer;background:var(--win);flex:none;
  box-shadow:inset 0 2px 5px #000,0 0 0 2px var(--ring),0 1px 0 2.5px var(--ring-hi);font-family:var(--f-silk);font-weight:600;font-size:11px;letter-spacing:.16em}
.txsw span{position:absolute;top:0;bottom:0;width:48px;display:grid;place-items:center;color:var(--lcd-1);transition:opacity .2s}
.txsw .l{left:2px}.txsw .r{right:2px;opacity:0}
.txsw i{position:absolute;top:3px;left:3px;width:38px;height:24px;border-radius:99px;background:linear-gradient(180deg,var(--k-hi),var(--k-lo));box-shadow:inset 0 1px 0 var(--k-glint),0 2px 4px rgba(0,0,0,.6);transform:translateX(44px);transition:transform .22s cubic-bezier(.3,1.3,.5,1)}
.txsw i::after{content:"";position:absolute;left:50%;top:50%;width:12px;height:12px;margin:-6px 0 0 -6px;border-radius:50%;background:radial-gradient(circle at 50% 30%,var(--dish-1),var(--dish-2));box-shadow:inset 0 1px 2px var(--dish-shadow)}
.txsw[aria-checked="true"] i{transform:none}
.txsw[aria-checked="true"] .l{opacity:0}.txsw[aria-checked="true"] .r{opacity:1}

/* screwed hatch */
.bay{position:relative;margin-top:24px;border-radius:14px;perspective:900px}
.cover{appearance:none;border:0;position:absolute;inset:0;z-index:3;border-radius:14px;cursor:pointer;color:inherit;
  background:linear-gradient(180deg,var(--plate-hi),var(--plate-lo));box-shadow:inset 0 1px 0 var(--plate-glint),inset 0 -1px 0 var(--plate-edge),0 0 0 1px var(--seam),0 8px 16px var(--drop);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;transform-origin:50% 100%;transition:transform .55s cubic-bezier(.5,0,.75,0),opacity .45s ease .1s}
.cover:hover .hint{color:var(--silk)}
.cover .screw{transition:transform .5s cubic-bezier(.4,0,.2,1)}
.cover.unscrew .screw{transform:rotate(-720deg) scale(1.25)}
.cover.off{transform:translateY(26px) scale(.97);opacity:0;pointer-events:none;visibility:hidden;transition:transform .45s cubic-bezier(.5,0,.75,0),opacity .35s ease .08s,visibility 0s .5s}
.cover.closing{transition:transform .45s cubic-bezier(.2,.9,.3,1.05),opacity .25s ease,visibility 0s}
.engr{font-family:var(--f-silk);font-weight:600;font-size:15px;letter-spacing:.3em;text-transform:uppercase;color:var(--engr);text-shadow:0 1px 0 var(--plate-glint)}
.closebay{position:absolute;top:12px;right:12px;height:32px;padding:0 12px;font-size:11px}
.advpanel{position:relative;min-height:128px;background:var(--recess);border-radius:14px;padding:18px 20px;box-shadow:inset 0 2px 6px var(--drop);display:flex;flex-wrap:wrap;gap:20px 34px;align-items:flex-start}
.advgrp{display:flex;flex-direction:column;gap:10px}
.advnote{flex-basis:100%;font-size:13px;color:var(--mute);max-width:70ch}

/* presets */
.cats{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.cat{height:40px;padding:0 14px;flex-direction:row;gap:9px}
.cat .led{width:8px;height:8px}
.presets{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px}
.pk{min-height:74px;padding:10px 12px;align-items:flex-start;justify-content:space-between;text-align:left;text-transform:none;letter-spacing:.04em}
.pk .top{display:flex;width:100%;justify-content:space-between;align-items:center;gap:8px}
.pk .no{font-family:var(--f-lcd);font-size:18px;color:var(--mute);letter-spacing:.04em}
.pk.on .no{color:var(--accent)}
.pk b{font-size:14px;font-weight:600;text-transform:uppercase;letter-spacing:.1em}
.pk span.sp{font-family:var(--f-mono);font-size:11.5px;color:var(--mute);letter-spacing:.02em}
.pk.pack{border-style:dashed}
.pk.pack .no{color:var(--accent)}
.knobrow{display:flex;justify-content:space-around;align-items:flex-start;gap:18px 10px;flex-wrap:wrap}
.foot{display:flex;align-items:center;justify-content:space-between;gap:16px}
.grille{flex:1;max-width:340px;height:30px;background:radial-gradient(circle,var(--hole) 0 1.6px,transparent 2.2px) 0 0/9px 9px;-webkit-mask:linear-gradient(90deg,transparent,#000 10%,#000 90%,transparent);mask:linear-gradient(90deg,transparent,#000 10%,#000 90%,transparent)}
.model{font-family:var(--f-silk);letter-spacing:.2em;font-size:12px;color:var(--dim);text-transform:uppercase}

/* outputs */
.outs{border-radius:18px;background:var(--recess);box-shadow:inset 0 2px 6px var(--drop);padding:8px}
.orow{display:grid;grid-template-columns:auto 1fr auto auto;gap:16px;align-items:center;padding:10px 12px}
.orow + .orow{border-top:1px solid var(--groove)}
.orow > div{min-width:0}
.orow .n{color:var(--strong);font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.orow .s{font-family:var(--f-mono);font-size:12.5px;color:var(--mute)}
.orow .note{font-size:12.5px;color:var(--warn-ink)}
.orow .sz{font-family:var(--f-mono);font-size:14px;color:var(--silk)}
.orow .sq{width:44px;height:44px}
.save{height:44px;padding:0 14px;flex-direction:row}
.empty{padding:18px;color:var(--dim);text-align:center;font-size:14px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom, 0px));transform:translateX(-50%) translateY(20px);opacity:0;background:#121417;border:1px solid #3a4049;color:#e7ecf2;padding:10px 16px;border-radius:10px;font-size:14px;transition:.2s;pointer-events:none;max-width:calc(100% - 32px);z-index:40}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.toast.err{border-color:var(--red)}

@media (max-width:820px){
  .plate{padding:30px 20px 24px}
  .top{grid-template-columns:minmax(0,1fr) 96px}
  .c-scope{grid-column:1 / -1;order:3}
  .c-meter .win{height:auto;aspect-ratio:240/150}
  .display{grid-template-columns:minmax(0,1fr)}
  .top{grid-template-columns:minmax(0,1fr) 200px}
  .dopen{grid-column:1 / -1;flex-direction:row;border-left:0;border-top:2px solid var(--lcd-ghost);padding:8px 0 0;margin:2px 0 0}
  .dopen .px{width:28px;height:28px}
  .display .dcol:nth-child(2){grid-column:1;grid-row:2}
  .dnum{grid-row:1 / span 2;grid-column:2}

const INFO={
  meter:['¿Lossless real?','La aguja marca hasta qué frecuencia llega el sonido. Un FLAC o WAV real llega arriba (~22 kHz). Pero un corte solo no basta: grabaciones analógicas y másters antiguos también cortan alto. El veredicto combina varias señales:','REAL = sin indicios. LOSSY = es MP3/AAC y lo dice. DUDA = corte suave o variable, puede ser analógico; no lo borres. FAKE = dice ser lossless y tiene la firma de un códec.'],
  lufs:['Medidas de volumen','LUFS: volumen percibido medio (ITU-R BS.1770-4). Spotify y YouTube igualan a unos −14.','TP (true peak): el pico real entre muestras, en dBTP. Por encima de −1 se enciende el LED: al convertir a MP3/AAC puede distorsionar. DR: cuánto se ha comprimido el máster (más alto = más dinámica; 6 o menos = muy aplastado). LRA: cuánto varía el volumen a lo largo de la canción, en LU.'],

  rate:['Frecuencia de muestreo','Cuántas veces por segundo se mide el sonido. 44,1 kHz es la del CD y cubre todo lo audible. «Orig.» deja la del archivo.','Subirla no mejora nada. Bájala solo si el equipo de destino no acepta la original (el MMI de Audi, por ejemplo, va a 44,1/48).'],

  tags:['Etiqueta','Título, artista, álbum y demás datos que ve tu radio o tu móvil. Se leen del archivo original y se escriben en el nuevo: ID3v2.3 en MP3, Vorbis en FLAC y átomos de iTunes en M4A. Las tildes y la ñ se guardan bien (UTF-16).'],

  id3:['ID3','Las etiquetas del MP3. ID3v2.3 va siempre (la versión que leen todos los equipos; la v2.4 da problemas en radios antiguas). ID3v1 es una versión mínima de los años 90 que algunas radios muy viejas solo saben leer: sin tildes y con 30 letras por campo.'],
  scope:['Espectrograma','Tiempo de izquierda a derecha, frecuencia de abajo arriba, intensidad en color. Un MP3 deja un techo plano y recto en toda la canción (la línea discontinua); una grabación real se difumina hacia arriba y varía con la música.','La escala lineal es la que mejor enseña ese techo. La logarítmica se parece más a cómo oímos.'],
  dial:['Línea de tiempo','La regla es la canción entera y la línea roja marca dónde empieza a sonar al pulsar Escuchar. Gira la rueda de sintonía de la derecha (3 vueltas = canción entera) o pulsa y arrastra sobre la regla.','También marca de dónde se sacan los 30 segundos del Pack de prueba.'],
  mode:['CBR o VBR','CBR (fijo) gasta los mismos kbps en cada segundo. VBR (variable) gasta más en los pasajes complejos y menos en los simples: mejor calidad por MB.','Algunas radios de coche antiguas fallan con VBR: la duración sale mal, el avance rápido salta o no lo leen. Si dudas, CBR. En MP3 aquí siempre es CBR.'],
  prof:['Perfil AAC','AAC-LC es el AAC normal, el que lee todo el mundo. HE-AAC añade un truco para sonar decente a muy pocos kbps (64 o menos), pero muchos equipos antiguos no lo soportan.','Para música a 128 kbps o más: siempre LC.'],

<script>
/* ---------- minimal M4A (MP4) muxer for AAC frames ---------- */
function m4aMux(frames,rate,ch,asc,kbps,flen=1024,meta=null,mo={}){
  const u32=v=>[(v>>>24)&255,(v>>>16)&255,(v>>>8)&255,v&255],u16=v=>[(v>>8)&255,v&255],str=s=>[...s].map(c=>c.charCodeAt(0));
  const flat=parts=>{const out=[];for(const p of parts){if(p instanceof Uint8Array)for(let i=0;i<p.length;i++)out.push(p[i]);else if(Array.isArray(p))for(let i=0;i<p.length;i++)out.push(p[i]);else out.push(p)}return out};
  const box=(type,...parts)=>{const body=flat(parts),o=[...u32(body.length+8),...str(type)];for(let i=0;i<body.length;i++)o.push(body[i]);return o};
  const full=(type,vf,...parts)=>box(type,u32(vf),...parts);
  if(!asc||!asc.length){const fi=[96000,88200,64000,48000,44100,32000,24000,22050,16000,12000,11025,8000].indexOf(rate);const v=(2<<11)|((fi<0?4:fi)<<7)|(ch<<3);asc=new Uint8Array([v>>8,v&255])}
  const n=frames.length,samples=mo.durs?mo.durs.reduce((a,b)=>a+b,0):n*flen,ms=Math.round(samples*1000/rate);
  const desc=(tag,body)=>[tag,body.length,...body];
  const esds=full('esds',0,desc(3,[...u16(1),0,...desc(4,[0x40,0x15,0,0x18,0,...u32(kbps*1000),...u32(kbps*1000),...desc(5,[...asc])]),...desc(6,[2])]));
  const mp4a=mo.alac?box('alac',[0,0,0,0,0,0],u16(1),u32(0),u32(0),u16(ch),u16(mo.bits||16),u16(0),u16(0),u32(rate<65536?(rate<<16)>>>0:0),full('alac',0,mo.alac)):box('mp4a',[0,0,0,0,0,0],u16(1),u32(0),u32(0),u16(ch),u16(16),u16(0),u16(0),u32(rate<<16>>>0),esds);
  const matrix=[...u32(0x10000),...u32(0),...u32(0),...u32(0),...u32(0x10000),...u32(0),...u32(0),...u32(0),...u32(0x40000000)];
  const moov=off=>box('moov',
    full('mvhd',0,u32(0),u32(0),u32(1000),u32(ms),u32(0x10000),u16(0x100),u16(0),u32(0),u32(0),matrix,u32(0),u32(0),u32(0),u32(0),u32(0),u32(0),u32(2)),
    box('trak',
      full('tkhd',7,u32(0),u32(0),u32(1),u32(0),u32(ms),u32(0),u32(0),u16(0),u16(0),u16(0x100),u16(0),matrix,u32(0),u32(0)),
      box('mdia',
        full('mdhd',0,u32(0),u32(0),u32(rate),u32(samples),u16(0x55c4),u16(0)),
        full('hdlr',0,u32(0),str('soun'),u32(0),u32(0),u32(0),str('SoundHandler'),0),
        box('minf',
          full('smhd',0,u16(0),u16(0)),
          box('dinf',full('dref',0,u32(1),full('url ',1))),
          box('stbl',
            full('stsd',0,u32(1),mp4a),
            (()=>{if(!mo.durs)return full('stts',0,u32(1),u32(n),u32(flen));const runs=[];for(const d of mo.durs){const l=runs[runs.length-1];if(l&&l[1]===d)l[0]++;else runs.push([1,d])}return full('stts',0,u32(runs.length),runs.flatMap(([c,d])=>[...u32(c),...u32(d)]))})(),
            full('stsc',0,u32(1),u32(1),u32(n),u32(1)),
            full('stsz',0,u32(0),u32(n),(()=>{const a=[];for(const f of frames)a.push(...u32(f.length));return a})()),
            full('stco',0,u32(1),u32(off)))))),udta);
  let udta=[];
  if(meta){const tg=meta.tags||{},items=[],txt=(n,v)=>{if(v)items.push(box(n,box('data',u32(1),u32(0),Array.from(new TextEncoder().encode(String(v))))))};

<script>

function entrySpec(e){
  if(e.pack)return'8 VERSIONES · 30 S · ZIP';
  const o={...BASE,...e.o},f=FMT[o.fmt],cod=CODECS.find(c=>c.id===codecOf(o.fmt)).name;
  if(!canEncode(o.fmt))return cod+' · NO DISPONIBLE EN ESTE NAVEGADOR';
  return[f.lossless?`${cod} ${o.bits===32?'32F':o.bits+' BIT'}`:`${cod} ${o.kbps}`,'.'+extOf(o),o.rate?fmtRate(o.rate):'FREC. ORIGINAL',o.mono?'MONO':null,o.norm==='lufs'?num(o.lufs,0)+' LUFS':null].filter(Boolean).join(' · ').toUpperCase();
}
const results=()=>{const ws=fold(NS.q).split(/\s+/).filter(Boolean);return ENTRIES.filter(e=>ws.every(w=>e.hay.includes(w)))};

function renderNav(){
  const box=$('#navBody');let focusE=null;

    $('#navDet').innerHTML='';return;
  }
  if(NS.q.trim()){
    const rs=results();NS.hi=Math.max(0,Math.min(NS.hi,rs.length-1));focusE=rs[NS.hi];
    box.className='navbody flat';
    box.innerHTML=rs.length?`<ul class="ncol" role="listbox" aria-label="Resultados">${rs.map((e,i)=>`<li role="option" aria-selected="${e.id===S.sel}" class="${e.id===S.sel?'hi sel':''} ${i===NS.hi?'cur':''}" data-eid="${e.id}"><span class="np">${esc(catName(e.cat))} › ${esc(e.brand)}</span><span class="nn">${esc(e.name)}</span><span class="ny">${esc(e.years)}</span></li>`).join('')}</ul>`
      :`<div class="nempty">NADA PARA «${esc(NS.q.toUpperCase())}».<br>PULSA ＋ PEDIR Y LO AÑADIMOS.</div>`;

      `<ul class="ncol ${NS.col===1?'act':''}" role="listbox" aria-label="Marca">${back(cat.name.toUpperCase())}${cat.brands.map((b,i)=>li(i===NS.b?(NS.col===1?'cur':'on'):'',`data-nb="${i}" aria-selected="${i===NS.b}"`,`<span class="nn">${esc(b.name.toUpperCase())}</span><span class="na">▸</span>`)).join('')}</ul>`+
      `<ul class="ncol ${NS.col===2?'act':''}" role="listbox" aria-label="Modelo">${back(br.name.toUpperCase())}${br.items.map((e,i)=>li(`${e.id===S.sel?'hi sel':''} ${i===NS.m&&NS.col===2?'cur':''}`,`data-eid="${e.id}" aria-selected="${e.id===S.sel}"`,`<span class="nn">${esc(e.name)}</span><span class="ny">${esc(e.years)}</span>`)).join('')}</ul>`;
  }
  const e=focusE||curEntry();NS.det=e&&e.id;

  box.querySelectorAll('.cur,.hi').forEach(h=>{const ul=h.parentElement,r=h.getBoundingClientRect(),p=ul.getBoundingClientRect();if(r.top<p.top)ul.scrollTop+=r.top-p.top;else if(r.bottom>p.bottom)ul.scrollTop+=r.bottom-p.bottom});

function navMove(d){
  if(NS.q.trim()){NS.hi+=d;renderNav();return}
  const cat=NAV[NS.c];
  if(NS.col===0){NS.c=(NS.c+d+NAV.length)%NAV.length;NS.b=0;NS.m=-1}
  else if(NS.col===1){NS.b=(NS.b+d+cat.brands.length)%cat.brands.length;NS.m=-1}
  else{const its=cat.brands[NS.b].items;NS.m=NS.m<0?(d>0?0:its.length-1):(NS.m+d+its.length)%its.length}

function navEnter(){

function bindNav(){
  const nav=$('#nav'),q=$('#navQ');
  q.addEventListener('input',()=>{NS.q=q.value;NS.hi=0;NS.req=false;renderNav()});
  nav.addEventListener('click',e=>{
    const t=e.target.closest('li,button');if(!t||S.busy)return;
    if(t.dataset.back){NS.col=Math.max(0,NS.col-1);renderNav();return}
    if(t.dataset.nc){NS.c=+t.dataset.nc;const bi=NAV[NS.c].brands.findIndex(b=>b.items.some(e=>e.id===S.sel));NS.b=Math.max(0,bi);NS.m=-1;NS.col=1;renderNav();return}
    if(t.dataset.nb){NS.b=+t.dataset.nb;NS.m=NAV[NS.c].brands[NS.b].items.findIndex(e=>e.id===S.sel);NS.col=2;renderNav();return}
    if(t.dataset.eid){applyEntry(ENTRIES.find(x=>x.id===t.dataset.eid));return}
    if(t.id==='reqBtn'){NS.req=!NS.req;renderNav();if(NS.req)setTimeout(()=>$('#reqIn')&&$('#reqIn').focus(),0);return}
    if(t.id==='reqCancel'){NS.req=false;renderNav();return}
    if(t.id==='reqSend')sendRequest();
  });
  nav.addEventListener('keydown',e=>{
    if(e.target.id==='reqIn'){if(e.key==='Enter')sendRequest();if(e.key==='Escape'){NS.req=false;renderNav();nav.focus()}return}
    const inQ=e.target===q;
    if(e.key==='ArrowDown'||e.key==='ArrowUp'){e.preventDefault();navMove(e.key==='ArrowDown'?1:-1);return}
    if(e.key==='Enter'){e.preventDefault();navEnter();return}
    if(e.key==='Escape'){q.value='';NS.q='';renderNav();nav.focus();return}
    if(inQ)return;
    if(e.key==='ArrowRight'){e.preventDefault();navEnter();return}
    if(e.key==='ArrowLeft'||e.key==='Backspace'){e.preventDefault();NS.col=Math.max(0,NS.col-1);renderNav();return}
    if(e.key.length===1&&!e.metaKey&&!e.ctrlKey){q.focus()}
  });

async function sendRequest(){
  const inp=$('#reqIn'),msg=$('#reqMsg'),txt=(inp.value||'').trim();if(!txt){inp.focus();return}

  catch(e){msg.textContent=e&&e.code==='invalid_argument'?'SOLO EL PROPIETARIO PUEDE GUARDAR PETICIONES EN ESTA VERSIÓN.':'NO SE PUDO GUARDAR. INTÉNTALO MÁS TARDE.'}
}
function crt(on){const n=$('#nav');n.classList.remove('crt-on','crt-off');void n.offsetWidth;n.classList.toggle('crt-dark',!on);if(!reduce)n.classList.add(on?'crt-on':'crt-off')}
function setMode(m){

}

<script>

const M={min:10,max:22,ang:50,cx:120,cy:178};

const mArc=(r,v0,v1)=>{const[a,b]=mPt(r,v0),[c,d]=mPt(r,v1);return`M${a} ${b}A${r} ${r} 0 0 1 ${c} ${d}`};

  const ng=document.getElementById('needle');if(ng)ng.setAttribute('transform',`rotate(${(-M.ang+2*M.ang*(needle.cur+jit)).toFixed(2)} 120 178)`);
  if(playing&&playing.src&&AC){playing.cur=Math.min(dur(),playing.off+AC.currentTime-playing.t0);placeRed(playing.cur)}

function bindKnob(id){

/* ---------- tuner dial ---------- */
const DPAD=14;
const dur=()=>S.src?S.src.dur:0;
function drawDial(){
  const cv=$('#dialCv'),r=cv.getBoundingClientRect(),dpr=devicePixelRatio||1,w=r.width,hh=r.height;if(!w)return;
  cv.width=w*dpr;cv.height=hh*dpr;const c=cv.getContext('2d');c.scale(dpr,dpr);
  const g=c.createLinearGradient(0,0,0,hh);g.addColorStop(0,'#f2f0e8');g.addColorStop(1,'#dedbd0');c.fillStyle=g;c.fillRect(0,0,w,hh);
  const d=dur();if(!d)return;
  const span=w-DPAD*2,steps=[1,2,5,10,15,30,60,120,300,600];let maj=steps.find(s=>d/s<=span/64)||900;
  const minor=maj/(maj%3===0&&maj>=15?6:5);

  c.lineWidth=1;c.beginPath();c.moveTo(DPAD,hh-12.5);c.lineTo(w-DPAD,hh-12.5);c.stroke();
  for(let s=0;s<=d+1e-6;s+=minor){const x=Math.round(DPAD+s/d*span)+.5,isM=Math.abs(s/maj-Math.round(s/maj))<1e-6;
    c.beginPath();c.moveTo(x,hh-12.5);c.lineTo(x,hh-12.5-(isM?16:7));c.lineWidth=isM?1.3:.8;c.stroke();
    if(isM)c.fillText(fmtTime(s),x,15)}
  const xe=Math.round(DPAD+span)+.5;c.beginPath();c.moveTo(xe,hh-12.5);c.lineTo(xe,hh-12.5-16);c.stroke();
  c.fillStyle='#c9271c';c.font='600 9px "Barlow Condensed", sans-serif';c.textAlign='right';c.fillText('FIN',w-DPAD-4,hh-2);
}
function placeRed(sec){

  setTune(dur()?sec/dur()*TURN:0);
  if(S.scopeOpen){const sc=$('#screen').clientWidth-56;$('#playhead').style.left=(10+(d?Math.min(1,sec/d):0)*sc)+'px'}
}
let seekT=null;
function setPos(sec,fromUser){glide++;
  S.pos=Math.max(0,Math.min(dur(),sec));placeRed(S.pos);$('#wheel').setAttribute('aria-valuetext',fmtTime(S.pos)+' de '+fmtTime(dur()));
  if(fromUser&&playing&&playing.src){clearTimeout(seekT);seekT=setTimeout(()=>{if(playing&&playing.src){const b=playing.btn;stopPlay(true);play(S.src.buffer,b,S.pos)}},140)}
}
function bindDial(){
  const dial=$('#dial'),wh=$('#wheel');let dd=null,wd=null;

  dial.addEventListener('pointerdown',e=>{e.preventDefault();dial.setPointerCapture(e.pointerId);dd=1;setPos(at(e.clientX),true)});
  dial.addEventListener('pointermove',e=>{if(dd)setPos(at(e.clientX),true)});

  const ang=e=>{const r=wh.getBoundingClientRect(),x=e.clientX-r.left-r.width/2,y=e.clientY-r.top-r.height/2;return{a:Math.atan2(x,-y)*180/Math.PI,d:Math.hypot(x,y)}};
  wh.addEventListener('pointerdown',e=>{e.preventDefault();wh.focus({preventScroll:true});wh.setPointerCapture(e.pointerId);wd=ang(e)});
  wh.addEventListener('pointermove',e=>{if(!wd)return;const n=ang(e);if(n.d<6)return;let da=n.a-wd.a;if(da>180)da-=360;if(da<-180)da+=360;wd=n;setPos(S.pos+da/TURN*dur(),true)});
  wh.addEventListener('pointerup',()=>wd=null);wh.addEventListener('pointercancel',()=>wd=null);
  wh.addEventListener('wheel',e=>{e.preventDefault();const d=Math.abs(e.deltaX)>Math.abs(e.deltaY)?e.deltaX:-e.deltaY;setPos(S.pos+d*.2/TURN*dur(),true)},{passive:false});
  wh.addEventListener('keydown',e=>{const k={ArrowUp:1,ArrowRight:1,ArrowDown:-1,ArrowLeft:-1,PageUp:10,PageDown:-10}[e.key];if(k){e.preventDefault();setPos(S.pos+k,true)}else if(e.key==='Home'){e.preventDefault();setPos(0,true)}});
  const ro=new ResizeObserver(()=>{drawDial();placeRed(S.pos)});ro.observe(dial);

const SPEC_LUT=(()=>{const st=[[0,[9,9,11]],[.22,[40,18,72]],[.45,[118,30,86]],[.65,[205,78,46]],[.82,[242,158,58]],[1,[252,244,210]]],lut=new Uint8Array(768);
  for(let i=0;i<256;i++){const x=i/255;let j=0;while(j<st.length-2&&x>st[j+1][0])j++;const[t0,c0]=st[j],[t1,c1]=st[j+1],f=(x-t0)/(t1-t0);for(let k=0;k<3;k++)lut[i*3+k]=c0[k]+(c1[k]-c0[k])*f}return lut})();

  else if(t.id==='convertBtn')convert();
});
addEventListener('keydown',e=>{if(e.key==='Escape')closeInfo()});
addEventListener('dragstart',e=>{if(e.target.closest&&e.target.closest('.plate'))e.preventDefault()});
addEventListener('scroll',closeInfo,{passive:true});
$('#display').addEventListener('click',()=>{if(!S.busy)$('#fileIn').click()});
$('#fileIn').addEventListener('change',e=>{const f=e.target.files[0];if(f)loadFile(f);e.target.value=''});
async function loadCover(f){try{const c=await coverDims({data:new Uint8Array(await f.arrayBuffer()),mime:f.type||'image/jpeg'});if(!c.w)throw 0;await setCoverSrc(c);toast('Carátula cambiada: '+c.w+'×'+c.h)}catch(e){toast('No se pudo leer esa imagen. Usa JPEG o PNG.',true)}}
$('#coverIn').addEventListener('change',e=>{const f=e.target.files[0];if(f)loadCover(f);e.target.value=''});
$('#tagForm').addEventListener('input',e=>{const k=e.target.dataset.tag;if(k){S.tags[k]=e.target.value;renderLabel()}});
(()=>{const sc=$('#screen');let d=0;const at=x=>{const r=sc.getBoundingClientRect();return Math.max(0,Math.min(1,(x-r.left-10)/(r.width-56)))*dur()};
  sc.addEventListener('pointerdown',e=>{e.preventDefault();sc.setPointerCapture(e.pointerId);d=1;setPos(at(e.clientX),true)});
  sc.addEventListener('pointermove',e=>{if(d)setPos(at(e.clientX),true)});sc.addEventListener('pointerup',()=>d=0);sc.addEventListener('pointercancel',()=>d=0)})();
let dragN=0;
const hasFiles=e=>!!e.dataTransfer&&[...e.dataTransfer.types].includes('Files');
addEventListener('dragenter',e=>{if(!hasFiles(e))return;e.preventDefault();dragN++;document.body.classList.add('dragging')});
addEventListener('dragleave',e=>{if(!hasFiles(e))return;if(--dragN<=0){dragN=0;document.body.classList.remove('dragging')}});
addEventListener('dragover',e=>e.preventDefault());
addEventListener('drop',e=>{e.preventDefault();dragN=0;document.body.classList.remove('dragging');const f=e.dataTransfer&&e.dataTransfer.files[0];if(!f)return;if(/^image\//.test(f.type))loadCover(f);else loadFile(f)});

/* ---------- light / dark ---------- */
function effDark(){const r=document.documentElement,s=r.dataset.skin;if(s)return s==='dark';const th=r.getAttribute('data-theme');if(th==='dark'||th==='light')return th==='dark';return matchMedia('(prefers-color-scheme: dark)').matches}
function syncTheme(){$('#themeBtn').setAttribute('aria-checked',effDark())}
$('#themeBtn').addEventListener('click',()=>{const n=effDark()?'light':'dark';document.documentElement.dataset.skin=n;try{localStorage.setItem('lb-skin',n)}catch(e){}syncTheme()});
try{const s=localStorage.getItem('lb-skin');if(s==='light'||s==='dark')document.documentElement.dataset.skin=s}catch(e){}
syncTheme();try{matchMedia('(prefers-color-scheme: dark)').addEventListener('change',syncTheme)}catch(e){}
new MutationObserver(syncTheme).observe(document.documentElement,{attributes:true,attributeFilter:['data-theme']});

(async function boot(){
  $('#playSrc').innerHTML=ICON_PLAY;
  buildMeter();buildLadder();Object.keys(KN).forEach(bindKnob);
  S.eng.mp3=typeof lamejs!=='undefined';
  const buf=makeDemo();
  S.src={name:'demo_sospechoso.flac',size:0,fmt:'FLAC',bits:16,rate:44100,ch:2,dur:buf.duration,buffer:buf,demo:true};
  S.tags={...emptyTags(),title:'Demo sospechoso',artist:'Lossless Buddy',album:'Muestras de prueba',track:'1/1',year:'2026',genre:'Electronic'};
  bindDial();bindNav();locate(curEntry());$('#manualBox').inert=true;resetDial();renderTagForm();renderAll();renderOuts();restLadder();requestAnimationFrame(loop);setTimeout(()=>crt(S.mode==='preset'),reduce?0:400);
  try{const cv=document.createElement('canvas');cv.width=cv.height=1400;const x=cv.getContext('2d'),g=x.createLinearGradient(0,0,1400,1400);g.addColorStop(0,'#ff7a45');g.addColorStop(.55,'#c8432f');g.addColorStop(1,'#2b1a4a');x.fillStyle=g;x.fillRect(0,0,1400,1400);
    x.strokeStyle='rgba(255,255,255,.85)';x.lineWidth=18;for(let i=0;i<9;i++){x.beginPath();x.arc(700,700,90+i*60,0,7);x.globalAlpha=1-i*.1;x.stroke()}x.globalAlpha=1;
    x.fillStyle='#fff';x.font='bold 120px sans-serif';x.textAlign='center';x.fillText('LOSSLESS',700,1230);
    const b=await new Promise(r=>cv.toBlob(r,'image/png'));await setCoverSrc(await coverDims({data:new Uint8Array(await b.arrayBuffer()),mime:'image/png'}))}catch(e){}
  try{if('AudioEncoder' in window){const r=await AudioEncoder.isConfigSupported({codec:'mp4a.40.2',sampleRate:44100,numberOfChannels:2,bitrate:256000});S.eng.aac=!!r.supported;
    const chk=async c=>{try{return(await AudioEncoder.isConfigSupported({codec:'mp4a.40.2',sampleRate:44100,numberOfChannels:2,bitrate:256000,...c})).supported}catch(e){return false}};
    if(S.eng.aac){S.eng.aacVbr=await chk({bitrateMode:'variable'});S.eng.aacAdts=await chk({aac:{format:'adts'}});S.eng.aacHe=await chk({codec:'mp4a.40.5',bitrate:64000})}
    try{S.eng.opus=!!(await AudioEncoder.isConfigSupported({codec:'opus',sampleRate:48000,numberOfChannels:2,bitrate:128000})).supported}catch(e){}}}catch(e){}
  ensureSupported();renderAll();
  await runAnalysis();
})();
